<svg xmlns="http://www.w3.org/2000/svg" width="252" height="34" viewBox="0 0 252 34" role="img" aria-label="cat reach">
  <style>
    text{font:13px 'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;white-space:pre}
    .cover{fill:#0a0a0a;animation:type 0.54s steps(9) .4s both}
    .caret{fill:#eaa06b;animation:blink 1.1s steps(1) infinite}
    @keyframes type{to{transform:translateX(70.2px)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cover{display:none}.caret{animation:none}}
  </style>
  <rect x=".5" y=".5" width="251" height="33" rx="8" fill="#0a0a0a" stroke="#302c25"/>
  <text x="17" y="22" textLength="210.6" lengthAdjust="spacing"><tspan fill="#e7e3da">kerim@antalya</tspan> <tspan fill="#a09a8d">~</tspan> <tspan fill="#eaa06b">❯</tspan> <tspan fill="#e7e3da">cat reach</tspan></text>
  <rect class="cover" x="157.4" y="8" width="72.2" height="19"/>
  <rect class="caret" x="228.6" y="9" width="7.8" height="16"/>
</svg>
